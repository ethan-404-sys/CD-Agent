<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MLLM 判断器审核</title>
<style>
:root {
  color-scheme: light;
  --bg: #f6f6f4; --surface: #fcfcfb; --surface-2: #efeeea; --border: #dcdbd5;
  --text: #0b0b0b; --text-2: #52514e; --muted: #85847e;
  --accent: #2a78d6; --good: #1f7a3a; --bad: #c4302b; --warn: #a86500;
  --series-1: #2a78d6; --series-2: #eb6834; --series-3: #1baf7a; --ref: #85847e;
  --diff-add: #d8f0dc; --diff-del: #f8d9d6;
}
@media (prefers-color-scheme: dark) {
  :root:where(:not([data-theme="light"])) {
    color-scheme: dark;
    --bg: #131312; --surface: #1a1a19; --surface-2: #242422; --border: #3a3936;
    --text: #f0efec; --text-2: #c3c2b7; --muted: #8f8e86;
    --accent: #3987e5; --good: #5cbf74; --bad: #f07470; --warn: #e0a440;
    --series-1: #3987e5; --series-2: #d95926; --series-3: #199e70; --ref: #8f8e86;
    --diff-add: #1f3d27; --diff-del: #4a2222;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #131312; --surface: #1a1a19; --surface-2: #242422; --border: #3a3936;
  --text: #f0efec; --text-2: #c3c2b7; --muted: #8f8e86;
  --accent: #3987e5; --good: #5cbf74; --bad: #f07470; --warn: #e0a440;
  --series-1: #3987e5; --series-2: #d95926; --series-3: #199e70; --ref: #8f8e86;
  --diff-add: #1f3d27; --diff-del: #4a2222;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.5 system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; }
header { display: flex; gap: 4px; align-items: center; padding: 10px 16px; background: var(--surface); border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 5; flex-wrap: wrap; }
header h1 { font-size: 15px; margin: 0 16px 0 0; }
nav button { background: none; border: 0; padding: 6px 12px; border-radius: 6px; color: var(--text-2); cursor: pointer; font: inherit; }
nav button.on { background: var(--surface-2); color: var(--text); font-weight: 600; }
main { padding: 16px; max-width: 1400px; margin: 0 auto; }
.cols { display: grid; grid-template-columns: 320px 1fr; gap: 16px; align-items: start; }
@media (max-width: 820px) { .cols { grid-template-columns: 1fr; } }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 12px 14px; margin-bottom: 12px; min-width: 0; }
.list { max-height: 75vh; overflow: auto; padding: 4px; }
.item { padding: 8px 10px; border-radius: 6px; cursor: pointer; }
.item:hover { background: var(--surface-2); }
.item.on { background: var(--surface-2); outline: 1px solid var(--accent); }
.meta { color: var(--text-2); font-size: 12px; }
.mono, pre { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12.5px; }
pre { white-space: pre-wrap; word-break: break-word; margin: 0; }
table { border-collapse: collapse; width: 100%; }
th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--border); vertical-align: top; }
th { color: var(--text-2); font-weight: 600; font-size: 12px; }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
.scroll { overflow-x: auto; }
tr.click { cursor: pointer; }
tr.click:hover td { background: var(--surface-2); }
.badge { display: inline-block; padding: 0 6px; border-radius: 4px; font-size: 12px; border: 1px solid var(--border); color: var(--text-2); margin-right: 4px; white-space: nowrap; }
.badge.good { color: var(--good); border-color: var(--good); }
.badge.bad { color: var(--bad); border-color: var(--bad); }
.badge.warn { color: var(--warn); border-color: var(--warn); }
.thumbs { display: flex; gap: 4px; }
.thumbs img { width: 96px; height: 96px; object-fit: cover; border-radius: 4px; background: var(--surface-2); }
.demos { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 10px; }
.demo { border: 1px solid var(--border); border-radius: 6px; padding: 8px; }
.demo .thumbs img { width: 100%; height: auto; aspect-ratio: 1; flex: 1; min-width: 0; }
.msg { border-left: 3px solid var(--border); padding-left: 10px; }
.msg .t { white-space: pre-wrap; margin: 6px 0; }
.msg .t.ans { color: var(--accent); font-weight: 600; }
.seg { margin: 8px 0; }
.query-seg { border: 1px solid var(--accent); border-radius: 6px; padding: 6px; }
.ph { width: 120px; height: 120px; border: 1px dashed var(--border); border-radius: 4px; display: grid; place-items: center; color: var(--muted); font-size: 12px; }
.msg img { width: 120px; height: 120px; object-fit: cover; border-radius: 4px; display: block; }
.msg .imgs { display: flex; flex-wrap: wrap; gap: 8px; margin: 4px 0; }
.msg figure { margin: 0; }
.msg figcaption { font-size: 11px; color: var(--muted); }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 10px; }
select, button.b { font: inherit; padding: 4px 8px; border-radius: 6px; border: 1px solid var(--border); background: var(--surface); color: var(--text); }
del { background: var(--diff-del); text-decoration: line-through; }
ins { background: var(--diff-add); text-decoration: none; }
.empty { color: var(--muted); padding: 24px; text-align: center; }
details summary { cursor: pointer; color: var(--text-2); }
.facets { display: grid; grid-template-columns: repeat(auto-fill, minmax(380px, 1fr)); gap: 12px; }
@media (max-width: 520px) { .facets { grid-template-columns: 1fr; } }
svg text { fill: var(--text-2); font-size: 11px; }
svg .grid { stroke: var(--border); stroke-width: 1; }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--text-2); margin-bottom: 8px; }
.legend i { display: inline-block; width: 18px; height: 0; border-top: 2px solid; vertical-align: middle; margin-right: 4px; }
#tip { position: fixed; pointer-events: none; background: var(--surface); border: 1px solid var(--border); border-radius: 6px; padding: 6px 8px; font-size: 12px; box-shadow: 0 2px 8px rgb(0 0 0 / .15); display: none; z-index: 10; max-width: 320px; }
.banner { background: var(--surface); border: 1px solid var(--bad); color: var(--bad); border-radius: 8px; padding: 8px 12px; margin-bottom: 12px; font-size: 13px; }
.banner ul { margin: 4px 0 0; padding-left: 18px; }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 10px; }
.ex { border: 1px solid var(--border); border-radius: 8px; padding: 10px; background: var(--surface); min-width: 0; }
.ex.pass { border-color: var(--good); }
.ex.reject { border-color: var(--bad); opacity: .72; }
.ex .imgs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; margin: 6px 0; }
.ex .imgs figure { margin: 0; min-width: 0; }
.ex .imgs img { width: 100%; aspect-ratio: 1; object-fit: cover; border-radius: 4px; background: var(--surface-2); display: block; }
.ex figcaption { font-size: 11px; color: var(--muted); }
.ex .rat { margin: 4px 0; }
.ex dl { display: grid; grid-template-columns: auto 1fr; gap: 0 8px; margin: 4px 0; font-size: 12px; }
.ex dt { color: var(--muted); }
.ex dd { margin: 0; }
.rev { display: flex; gap: 6px; align-items: center; margin-top: 6px; flex-wrap: wrap; }
.rev button { font: inherit; font-size: 12px; padding: 2px 10px; border-radius: 6px; border: 1px solid var(--border); background: var(--surface); color: var(--text-2); cursor: pointer; }
.rev button.on-pass { border-color: var(--good); color: var(--good); font-weight: 600; }
.rev button.on-reject { border-color: var(--bad); color: var(--bad); font-weight: 600; }
.rev input { flex: 1; min-width: 120px; font: inherit; font-size: 12px; padding: 3px 6px; border: 1px solid var(--border); border-radius: 6px; background: var(--surface); color: var(--text); }
.comp { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 10px; }
.comp table td, .comp table th { padding: 2px 6px; font-size: 12px; }
.seg-tog { display: inline-flex; border: 1px solid var(--border); border-radius: 6px; overflow: hidden; }
.seg-tog button { font: inherit; font-size: 13px; padding: 4px 10px; border: 0; background: var(--surface); color: var(--text-2); cursor: pointer; }
.seg-tog button.on { background: var(--surface-2); color: var(--text); font-weight: 600; }
tr.ref td { color: var(--text-2); font-style: italic; background: var(--surface-2); }
tr.dshead td { font-weight: 600; background: var(--bg); }
</style>
</head>
<body>
<header>
  <h1>MLLM 判断器审核</h1>
  <nav id="tabs">
    <button data-tab="prompts">提示词</button>
    <button data-tab="sets">样本集与审核</button>
    <button data-tab="demos">ICL 示例集</button>
    <button data-tab="runs">运行与输出</button>
    <button data-tab="shots">示例数量曲线</button>
  </nav>
</header>
<main><div id="banner"></div><div id="main"></div></main>
<div id="tip"></div>
<script>
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c]));
const pct = v => v == null ? '–' : (v * 100).toFixed(1);
const f3 = v => v == null ? '–' : v.toFixed(3);
const ci3 = c => c ? `<span class="meta">[${f3(c[0])}, ${f3(c[1])}]</span>` : '';
const ciP = c => c ? `<span class="meta">[${pct(c[0])}, ${pct(c[1])}]</span>` : '';
const api = (p, opts) => fetch(p, opts).then(r => { if (!r.ok) throw new Error(r.status + ' ' + p); return r.json(); });
const MODE = {zero: '零样本', few: '少示例', many: '多示例', batched_many: '多示例批量'};
const FORM = {A: 'A 近景', B: 'B 整图+掩码', AB: 'A+B'};
const PURPOSE = {demo_pool: '示例池', dev: '开发集', test: '测试集'};
const SPLIT_FOR = {demo_pool: 'train', dev: 'val', test: 'test'};
const SEM_TIP = 'SECOND 只在变化区标注地类；“无标注地类”表示该处没有标注，不代表已知地类。';
const STRATA = {pos2: '② 正例', pos_other: '其他正例（①③）', hard_neg: '难负例', rand_neg: '随机负例'};
const READOUT = {token_prob: '词元概率', verbal_confidence: '口头置信度', answer_only: '只有回答'};
const DOMAIN = {same: '同域', cross: '跨域', mixed: '混合', none: '—'};
const state = {tab: null, prompt: [], set: null, setFilter: {label: '', review: '', stratum: ''}, setShown: 60,
  demoSet: null, purpose: 'dev', run: null, query: null, filters: {dataset: '', source: '', stratum: '', verdict: ''}, shots: {}};
const opt = (v, l, cur) => `<option value="${esc(v)}" ${v === cur ? 'selected' : ''}>${esc(l)}</option>`;
const segTog = (id, items, cur) => `<span class="seg-tog" id="${id}">${items.map(([v, l]) =>
  `<button data-v="${esc(v)}" class="${v === cur ? 'on' : ''}">${esc(l)}</button>`).join('')}</span>`;
const onSeg = (id, fn) => $$(`#${id} button`).forEach(b => b.onclick = () => fn(b.dataset.v));

function setTab(tab) {
  state.tab = tab;
  try { localStorage.setItem('tab', tab); } catch (e) {}
  $$('#tabs button').forEach(b => b.classList.toggle('on', b.dataset.tab === tab));
  ({prompts: viewPrompts, sets: viewSets, demos: viewDemos, runs: viewRuns, shots: viewShots})[tab]().catch(e => {
    $('#main').innerHTML = `<div class="empty">加载失败：${esc(e.message)}</div>`;
  });
  loadBanner();
}
$$('#tabs button').forEach(b => b.onclick = () => setTab(b.dataset.tab));
async function loadBanner() {
  const v = await api('/api/checks').catch(() => []);
  $('#banner').innerHTML = v.length ? `<div class="banner"><b>划分检查未通过</b>（示例只能来自训练部分，开发集来自验证部分，测试样本来自测试部分，三者按原图互不重叠）<ul>${v.map(x => `<li>${esc(x.text)}</li>`).join('')}</ul></div>` : '';
}

// ---------- 提示词 ----------
function wordDiff(a, b) {
  const A = a.split(/(\s+)/), B = b.split(/(\s+)/), n = A.length, m = B.length;
  const L = Array.from({length: n + 1}, () => new Uint16Array(m + 1));
  for (let i = n - 1; i >= 0; i--) for (let j = m - 1; j >= 0; j--)
    L[i][j] = A[i] === B[j] ? L[i + 1][j + 1] + 1 : Math.max(L[i + 1][j], L[i][j + 1]);
  let i = 0, j = 0, out = '';
  while (i < n && j < m) {
    if (A[i] === B[j]) { out += esc(A[i]); i++; j++; }
    else if (L[i + 1][j] >= L[i][j + 1]) out += `<del>${esc(A[i++])}</del>`;
    else out += `<ins>${esc(B[j++])}</ins>`;
  }
  while (i < n) out += `<del>${esc(A[i++])}</del>`;
  while (j < m) out += `<ins>${esc(B[j++])}</ins>`;
  return out;
}
async function viewPrompts() {
  const list = await api('/api/prompts');
  if (!list.length) { $('#main').innerHTML = '<div class="empty">库里还没有提示词。</div>'; return; }
  const sel = state.prompt.filter(id => list.some(p => p.id === id));
  if (!sel.length) sel.push(list[0].id);
  state.prompt = sel;
  const byId = Object.fromEntries(list.map(p => [p.id, p]));
  let body;
  if (sel.length === 2) {
    const [a, b] = sel.map(id => byId[id]);
    body = `<div class="card"><div class="row"><b>对比</b><span class="badge bad">${esc(a.name)}</span>→<span class="badge good">${esc(b.name)}</span></div>
      <pre>${wordDiff(a.text, b.text)}</pre></div>`;
  } else {
    const p = byId[sel[0]];
    body = `<div class="card"><div class="row"><b>${esc(p.name)}</b><span class="badge mono">${p.id}</span>
      ${p.parent_id ? `<span class="meta">父版本 ${esc(byId[p.parent_id]?.name ?? p.parent_id)}</span>` : ''}
      <span class="meta">${p.runs} 次运行 · ${esc(p.models ?? '')}</span></div>
      ${p.note ? `<p class="meta">${esc(p.note)}</p>` : ''}<pre>${esc(p.text)}</pre></div>`;
  }
  $('#main').innerHTML = `<div class="cols"><div class="card list">
      <div class="meta" style="padding:4px 10px">点击查看；按住 Shift 点第二个做对比</div>
      ${list.map(p => `<div class="item ${sel.includes(p.id) ? 'on' : ''}" data-id="${p.id}">
        <div>${esc(p.name)}</div><div class="meta mono">${p.id} · ${p.runs} 次运行</div></div>`).join('')}
    </div><div>${body}</div></div>`;
  $$('.item').forEach(el => el.onclick = e => {
    const id = el.dataset.id;
    state.prompt = e.shiftKey && state.prompt[0] !== id ? [state.prompt[0], id] : [id];
    viewPrompts();
  });
}

// ---------- 示例卡片（样本集与 ICL 示例集共用） ----------
const labelBadge = l => l == null ? '<span class="badge">无标签</span>' : l ? '<span class="badge good">有变化</span>' : '<span class="badge">无变化</span>';
const fig = (id, key, cap) => `<figure><img loading="lazy" src="/img/${id}/${key}" alt="${esc(cap)}"><figcaption>${esc(cap)}</figcaption></figure>`;
function exampleCard(s, {review = null, wantSplit = 'train', position = null} = {}) {
  const keys = s.inputs;
  const A = ['t1', 't2'].filter(k => keys.includes(k));
  const B = ['full_t1', 'full_t2', 'mask'].filter(k => keys.includes(k));
  const capA = {t1: 'A · T1 近景', t2: 'A · T2 近景'}, capB = {full_t1: 'B · T1 整图', full_t2: 'B · T2 整图', mask: 'B · 变化掩码'};
  const canThumb = keys.includes('thumb') || (s.bbox && (keys.includes('full_t2') || keys.includes('full_t1')));
  const st = s.review_status;
  return `<div class="ex ${st ?? ''}" data-sid="${s.id}">
    <div class="row" style="margin:0">${position != null ? `<b>#${position + 1}</b>` : ''}${labelBadge(s.label)}
      ${s.shown_label && s.label != null && (s.shown_label === 'yes') !== !!s.label ? '<span class="badge bad">提示答案与标签不符</span>' : ''}
      ${s.stratum ? `<span class="badge">${STRATA[s.stratum] ?? esc(s.stratum)}</span>` : ''}
      ${s.split !== wantSplit ? `<span class="badge bad">来自 ${esc(s.split)}，应为 ${wantSplit}</span>` : ''}</div>
    <div class="rat">${s.rationale ? esc(s.rationale) : '<span class="meta">（没有理由）</span>'}</div>
    <div class="imgs">${A.map(k => fig(s.id, k, capA[k])).join('')}
      ${canThumb ? `<figure><img loading="lazy" src="/thumb/${s.id}" alt="位置"><figcaption>整图位置（黄框）</figcaption></figure>` : ''}</div>
    ${B.length ? `<details><summary>B 形式：整图与掩码</summary><div class="imgs">${B.map(k => fig(s.id, k, capB[k])).join('')}</div>
      ${s.semantic_text ? `<div class="meta" style="white-space:pre-line" title="${SEM_TIP}">${esc(s.semantic_text)}</div>` : ''}</details>` : ''}
    <dl>${s.label === 0 ? `<dt>伪变化类型</dt><dd>${esc(s.pseudo_type ?? '—')}</dd>` : ''}
      ${s.label === 1 && s.change_kind ? `<dt>变化种类</dt><dd>${esc(s.change_kind)}</dd>` : ''}
      <dt>面积</dt><dd>${s.area ?? '—'} 像素</dd><dt>来源</dt><dd>${esc(s.source ?? '—')}</dd>
      <dt>检测器均值 D</dt><dd>${f3(s.det_mean)}</dd>${s.m1_score != null ? `<dt>M1-ign3</dt><dd>${f3(s.m1_score)}</dd>` : ''}
      ${s.weight != null && s.weight !== 1 ? `<dt>抽样权重</dt><dd>${s.weight}</dd>` : ''}
      <dt>原图</dt><dd class="mono">${esc(s.dataset)}/${esc(s.split)} · ${esc(s.image ?? '')} · ${esc(s.cid)}</dd></dl>
    ${review ? `<div class="rev"><button data-st="pass" class="${st === 'pass' ? 'on-pass' : ''}">通过</button>
      <button data-st="reject" class="${st === 'reject' ? 'on-reject' : ''}">剔除</button>
      <button data-st="" title="撤销本样本的审核，回到未审">撤销</button>
      <input placeholder="备注（回车保存）" value="${esc(s.review_note ?? '')}"></div>` : ''}
  </div>`;
}
function countTable(title, obj) {
  const entries = Object.entries(obj ?? {});
  if (!entries.length) return '';
  return `<div><b class="meta">${esc(title)}</b><table>${entries.map(([k, v]) => `<tr><td>${esc(STRATA[k] ?? k)}</td><td class="num">${v}</td></tr>`).join('')}</table></div>`;
}
function compositionHtml(c, pool) {
  return `<div class="row"><span class="badge">正例 ${c.n_pos}</span><span class="badge">负例 ${c.n_neg}</span>
    <span class="badge">${c.images} 张原图</span>
    <span class="badge ${pool && c.max_per_image > 2 ? 'bad' : ''}">单图最多 ${c.max_per_image} 个${pool && c.max_per_image > 2 ? '（规则 ≤ 2）' : ''}</span></div>
    <div class="comp">${countTable('分层', c.strata)}${countTable('伪变化类型（负例）', c.pseudo_type)}
    ${countTable('变化种类（正例）', c.change_kind)}${countTable('面积档', c.area)}${countTable('来源', c.source)}${countTable('划分', c.split)}</div>`;
}

// ---------- 样本集与审核 ----------
async function viewSets() {
  const sets = await api('/api/sets');
  if (!sets.length) { $('#main').innerHTML = '<div class="empty">库里还没有示例池、开发集或测试集。</div>'; return; }
  if (!sets.some(s => s.id === state.set)) { state.set = (sets.find(s => s.purpose === 'demo_pool') ?? sets[0]).id; state.setShown = 60; }
  const d = await api('/api/sets/' + state.set);
  const pool = d.purpose === 'demo_pool', f = state.setFilter;
  const items = d.items.filter(i => (!f.label || String(i.label) === f.label) && (!f.stratum || i.stratum === f.stratum)
    && (!f.review || (i.review_status ?? 'todo') === f.review));
  const r = d.items.reduce((a, i) => (a[i.review_status ?? 'todo']++, a), {pass: 0, reject: 0, todo: 0});
  $('#main').innerHTML = `<div class="cols"><div class="card list">
      ${sets.map(x => `<div class="item ${x.id === d.id ? 'on' : ''}" data-id="${x.id}">
        <div>${esc(x.name)}</div><div class="meta">${esc(x.dataset)} · ${PURPOSE[x.purpose]} · ${x.n} 个，正例 ${x.n_pos}</div>
        ${x.purpose === 'demo_pool' ? `<div class="meta">已审 ${(x.reviewed.pass ?? 0) + (x.reviewed.reject ?? 0)} / ${x.n}（剔除 ${x.reviewed.reject ?? 0}）</div>` : ''}</div>`).join('')}
    </div><div>
      <div class="card"><div class="row"><b>${esc(d.name)}</b><span class="badge">${PURPOSE[d.purpose]}</span><span class="badge">${esc(d.dataset)}</span>
        <span class="meta">应来自 ${SPLIT_FOR[d.purpose]} 划分</span>
        ${pool ? `<span class="badge good">通过 ${r.pass}</span><span class="badge bad">剔除 ${r.reject}</span><span class="badge">未审 ${r.todo}</span>` : ''}</div>

function renderTemplate(run, query, batch = []) {
  // Group parts by owner (demo[i] / query[j] / plain text); a short text right before an
  // image becomes that image's caption. Demos fold into <details> when there are many.
  const owner = ref => ref?.match(/^(demo|query)\[(\d+)\]/)?.[0] ?? null;
  const sampleOf = o => { const [, kind, i] = o.match(/^(demo|query)\[(\d+)\]/); return kind === 'demo' ? run.demos[+i] : (batch[+i] ?? (+i === 0 ? query : null)); };
  return run.template.map(msg => {
    const segs = [];
    msg.content.forEach((part, i) => {
      const next = msg.content[i + 1];
      if (part.type === 'text' && !part.ref && next?.type === 'image' && part.text.length < 80) return;
      const o = owner(part.ref);
      const last = segs[segs.length - 1];
      if (o && last?.owner === o) last.parts.push({part, cap: msg.content[i - 1]});
      else segs.push({owner: o, parts: [{part, cap: msg.content[i - 1]}]});
    });
    const html = segs.map(seg => {
      if (!seg.owner) return seg.parts.map(({part}) => `<div class="t">${esc(part.text)}</div>`).join('');
      const s = sampleOf(seg.owner), key = r => r.split('.').pop();
      const figs = seg.parts.filter(x => x.part.type === 'image').map(({part, cap}) => {
        const c = cap?.type === 'text' && !cap.ref && cap.text.length < 80 ? cap.text : part.ref;
        return s ? `<figure><img loading="lazy" src="/img/${s.id}/${key(part.ref)}"><figcaption>${esc(c)}</figcaption></figure>`
          : `<figure><div class="ph">同批其他查询</div><figcaption>${esc(c)}</figcaption></figure>`;
      }).join('');
      const texts = seg.parts.filter(x => x.part.type === 'text' && x.part.ref).map(({part}) =>
        part.ref.endsWith('.answer') ? `<div class="t ans">Answer: ${esc(s?.shown_label ?? '?')}${s?.rationale ? ` · ${esc(s.rationale)}` : ''}</div>`
        : part.ref.endsWith('.semantic') ? `<div class="t" title="${SEM_TIP}">${esc(s?.semantic_text ?? '')}</div>` : '').join('');
      const head = seg.owner.startsWith('demo') && s ? `<div class="meta">${esc(seg.owner)} · ${esc(s.dataset)}/${esc(s.split)} · ${esc(s.cid)}${s.split !== 'train' ? ` <span class="badge bad">来自 ${esc(s.split)}</span>` : ''}</div>`
        : `<div class="meta">${esc(seg.owner)}${s ? ' · ' + esc(s.cid) : ''}${s && s.id === query.id ? ' <span class="badge">选中</span>' : ''}</div>`;
      return `<div class="seg ${seg.owner.startsWith('demo') ? 'demo-seg' : 'query-seg'}">${head}<div class="imgs">${figs}</div>${texts}</div>`;
    });
    let out = '', demoBuf = [];
    const flushDemos = () => {
      if (!demoBuf.length) return;
      out += demoBuf.length > 4 ? `<details><summary>${demoBuf.length} 个示例（展开）</summary>${demoBuf.join('')}</details>` : demoBuf.join('');
      demoBuf = [];
    };
    html.forEach((h, i) => { if (segs[i].owner?.startsWith('demo')) demoBuf.push(h); else { flushDemos(); out += h; } });
    flushDemos();
    return `<div class="msg"><div class="meta">${esc(msg.role)}</div>${out}</div>`;
  }).join('');
}

        <td class="num">${fmt(r[M])}</td><td class="num">${r[M + '_ci'] ? r[M + '_ci'].map(fmt).join(' – ') : '–'}</td><td class="num">${r.n}</td><td></td></tr>`).join('')}
      ${use.sort((a, b) => a.dataset.localeCompare(b.dataset) || a.mode.localeCompare(b.mode) || a.form.localeCompare(b.form) || a.k - b.k).map(p => `<tr><td>${esc(p.dataset)}</td><td>${esc(p.eval_set ?? '—')}</td><td>${MODE[p.mode]}</td>
        <td>${FORM[p.form]}</td><td class="num">${p.k}</td><td>${esc(p.prompt_name)}</td><td class="num">${fmt(p[M])}</td>
        <td class="num">${p[M + '_ci'] ? p[M + '_ci'].map(fmt).join(' – ') : '–'}</td><td class="num">${p.n}</td><td class="meta">${esc(p.run)}</td></tr>`).join('')}
    </tbody></table></div>`;
  onSeg('purpose', v => { state.purpose = v; viewShots(); });
  $('#s-model').onchange = e => { sf.model = e.target.value; viewShots(); };
  $('#s-prompt').onchange = e => { sf.prompt = e.target.value; viewShots(); };
  $('#s-metric').onchange = e => { sf.metric = e.target.value; viewShots(); };
  $('#facets').innerHTML = datasets.map(ds => `<div><b>${esc(ds)}</b>${facet(use.filter(p => p.dataset === ds),
    refs.filter(r => r.dataset === ds), M, fmt)}</div>`).join('') || '<div class="empty">这个筛选下没有数据。</div>';
  $$('#facets [data-tip]').forEach(el => {
    el.onmousemove = e => showTip(e, el.dataset.tip);
    el.onmouseleave = () => tip.style.display = 'none';
  });
}
function facet(points, refs, metric, fmt) {
  const W = 420, H = 250, m = {l: 44, r: 92, t: 12, b: 34};
  const maxK = Math.max(8, ...points.map(p => p.k));
  const X = k => m.l + Math.log2(k + 1) / Math.log2(maxK + 1) * (W - m.l - m.r);
  const vals = [...points, ...refs].flatMap(p => [p[metric], ...(p[metric + '_ci'] ?? [])]);
  let lo = Math.min(...vals), hi = Math.max(...vals);
  const pad = Math.max(.02, (hi - lo) * .1); lo = Math.max(0, lo - pad); hi = Math.min(1, hi + pad);
  const Y = v => m.t + (1 - (v - lo) / (hi - lo)) * (H - m.t - m.b);
  const ticksX = [0, 1, 2, 4, 8, 16, 32, 64, 128, 256, 512].filter(k => k <= maxK);
  const ticksY = Array.from({length: 5}, (_, i) => lo + (hi - lo) * i / 4);
  let svg = ticksY.map(v => `<line class="grid" x1="${m.l}" x2="${W - m.r}" y1="${Y(v)}" y2="${Y(v)}"/><text x="${m.l - 6}" y="${Y(v) + 4}" text-anchor="end">${fmt(v)}</text>`).join('')
    + ticksX.map(k => `<text x="${X(k)}" y="${H - m.b + 16}" text-anchor="middle">${k}</text>`).join('')
    + `<text x="${(W - m.r + m.l) / 2}" y="${H - 4}" text-anchor="middle">示例数 k（对数刻度）</text>`;
  const ciOf = p => p[metric + '_ci'] ? ` [${p[metric + '_ci'].map(fmt).join(', ')}]` : '';
  const tipOf = p => esc(`${p.run}\n${MODE[p.mode]} · ${FORM[p.form]} · k=${p.k} · ${p.prompt_name}\n${METRICS[metric]} ${fmt(p[metric])}${ciOf(p)} · n=${p.n}`).replace(/\n/g, '<br>');
  // Reference lines with direct labels at the right edge, nudged apart.
  const labels = [];
  const refLine = (v, dash, label, tipText) => {
    svg += `<line x1="${m.l}" x2="${W - m.r}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--ref)" stroke-width="1.5" stroke-dasharray="${dash}"/>
      <line x1="${m.l}" x2="${W - m.r}" y1="${Y(v)}" y2="${Y(v)}" stroke="transparent" stroke-width="10" data-tip="${tipText}"/>`;
    labels.push({y: Y(v), label});
  };
  for (const r of refs) refLine(r[metric], '1.5 3', r.name.startsWith('D') ? 'D' : 'M1-ign3', esc(`参照 ${r.name} · ${r.eval_set}\n${METRICS[metric]} ${fmt(r[metric])}${ciOf(r)} · n=${r.n}`).replace(/\n/g, '<br>'));
  for (const z of points.filter(p => p.mode === 'zero')) refLine(z[metric], '5 3', `零样本 ${z.prompt_name}`, tipOf(z));
  labels.sort((a, b) => a.y - b.y);
  labels.forEach((l, i) => { if (i && l.y - labels[i - 1].y < 12) l.y = labels[i - 1].y + 12; });
  svg += labels.map(l => `<text x="${W - m.r + 4}" y="${l.y + 4}">${esc(l.label.length > 15 ? l.label.slice(0, 14) + '…' : l.label)}</text>`).join('');
  const groups = {};
  for (const p of points.filter(p => p.mode !== 'zero')) (groups[`${p.mode}|${p.form}|${p.prompt_id}`] ??= []).push(p);
  for (const [key, g] of Object.entries(groups)) {
    const [mode, form] = key.split('|'), color = SERIES[mode];
    g.sort((a, b) => a.k - b.k);
    svg += `<polyline fill="none" stroke="${color}" stroke-width="2" stroke-dasharray="${DASH[form]}" points="${g.map(p => `${X(p.k)},${Y(p[metric])}`).join(' ')}"/>`;
    for (const p of g) {
      const c = p[metric + '_ci'];
      if (c) svg += `<line x1="${X(p.k)}" x2="${X(p.k)}" y1="${Y(c[0])}" y2="${Y(c[1])}" stroke="${color}" stroke-width="1.5" opacity=".55"/>`;
    }
  }
  for (const p of points.filter(p => p.mode !== 'zero')) {
    svg += `<circle cx="${X(p.k)}" cy="${Y(p[metric])}" r="4.5" fill="${SERIES[p.mode]}" stroke="var(--surface)" stroke-width="2"/>
      <circle cx="${X(p.k)}" cy="${Y(p[metric])}" r="12" fill="transparent" data-tip="${tipOf(p)}"/>`;
  }
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="示例数与${METRICS[metric]}">${svg}</svg>`;
}

let first = 'sets';
try { first = localStorage.getItem('tab') || first; } catch (e) {}
setTab(['prompts', 'sets', 'demos', 'runs', 'shots'].includes(first) ? first : 'sets');
</script>
